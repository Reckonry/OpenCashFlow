name: CI - Production Release

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*.*"
      - "webapp-v*.*.*"
      - "webapp-v*.*.*.*"
      - "api-v*.*.*"
      - "api-v*.*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to release (e.g. v1.2.3 or webapp-v1.2.3)"
        required: true
        type: string
      create_release:
        description: "Create a GitHub Release for this tag?"
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  actions: read

concurrency:
  group: production
  cancel-in-progress: false

env:
  TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  gate-has-rc:
    name: Require RC tag
    runs-on: ubuntu-latest
    outputs:
      rc_tag: ${{ steps.rcgate.outputs.rc_tag }}
    steps:
      - name: Checkout tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify matching RC exists
        id: rcgate
        shell: bash
        run: |
          set -euo pipefail
          TAG="${TAG_NAME}"

          component=""
          version=""
          if [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?)$ ]]; then
            version="${BASH_REMATCH[1]}"
          elif [[ "$TAG" =~ ^(webapp|api)-v([0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?)$ ]]; then
            component="${BASH_REMATCH[1]}"
            version="${BASH_REMATCH[2]}"
          else
            echo "Unsupported tag format: $TAG"
            exit 1
          fi

          candidates=()
          if [[ -z "$component" ]]; then
            candidates+=("v${version}-RC")
          else
            candidates+=("${component}-v${version}-RC")
          fi

          git fetch --tags --force

          found=""
          for candidate in "${candidates[@]}"; do
            if git rev-parse -q --verify "refs/tags/${candidate}" >/dev/null; then
              found="$candidate"
              break
            fi
            if git ls-remote --tags origin | grep -E "refs/tags/${candidate}$" >/dev/null; then
              found="$candidate"
              break
            fi
          done

          if [[ -z "$found" ]]; then
            echo "No RC tag found. Expected one of: ${candidates[*]}"
            exit 2
          fi

          echo "rc_tag=$found" >> "$GITHUB_OUTPUT"

  prod-release:
    name: Production Release
    needs: gate-has-rc
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine scope
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          TAG="${TAG_NAME}"
          DEPLOY_WEBAPP=0
          DEPLOY_API=0

          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            DEPLOY_WEBAPP=1
            DEPLOY_API=1
          elif [[ "$TAG" =~ ^webapp-v.*$ ]]; then
            DEPLOY_WEBAPP=1
          elif [[ "$TAG" =~ ^api-v.*$ ]]; then
            DEPLOY_API=1
          else
            echo "Unrecognized production tag: $TAG"
            exit 1
          fi

          echo "DEPLOY_WEBAPP=$DEPLOY_WEBAPP" >> "$GITHUB_OUTPUT"
          echo "DEPLOY_API=$DEPLOY_API" >> "$GITHUB_OUTPUT"

      - name: Download WebApp publish artifact from RC
        if: steps.scope.outputs.DEPLOY_WEBAPP == '1'
        uses: dawidd6/action-download-artifact@v11
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: ci-master-to-staging.yml
          workflow_conclusion: success
          name: webapp-publish
          path: artifacts/webapp-publish
          search_artifacts: true

      - name: Download API publish artifact from RC
        if: steps.scope.outputs.DEPLOY_API == '1'
        uses: dawidd6/action-download-artifact@v11
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: ci-master-to-staging.yml
          workflow_conclusion: success
          name: api-publish
          path: artifacts/api-publish
          search_artifacts: true

      - name: Copy EmailTemplates into API publish output
        if: steps.scope.outputs.DEPLOY_API == '1'
        run: |
          if [ -d "src/OpenCashFlow.API/EmailTemplates" ]; then
            cp -r src/OpenCashFlow.API/EmailTemplates artifacts/api-publish/
          fi

      - name: Create GitHub Release
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.create_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "Production Release ${{ env.TAG_NAME }}"
          prerelease: false
          generate_release_notes: true
          body: |
            Production release promoted from RC: ${{ needs.gate-has-rc.outputs.rc_tag }}

            Components:
            ${{ steps.scope.outputs.DEPLOY_WEBAPP == '1' && 'WEBAPP' || 'WEBAPP skipped' }}
            ${{ steps.scope.outputs.DEPLOY_API == '1' && 'API' || 'API skipped' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
