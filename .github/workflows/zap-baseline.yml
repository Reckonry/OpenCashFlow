# OWASP ZAP Baseline Scan workflow
# - Runs a passive (baseline) scan against the locally started app
# - Generates HTML reports under reports/
# - Structured quality gate: fails on Medium/High alerts except explicitly accepted technical debt

name: ZAP Baseline check

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
    tags:
      # Global RC tags
      - 'v*.*.*-RC'
      - 'v*.*.*.*-RC'

jobs:
  zap-baseline:
    name: zap-baseline
    runs-on: ubuntu-latest
    env:
      # Targets (App + API)
      APP_BASE_URL: http://localhost:5200
      API_BASE_URL: http://localhost:5100
      TARGET_APP: http://host.docker.internal:5200
      TARGET_API: http://host.docker.internal:5100
      ZAP_IMAGE: zaproxy/zap-stable   # Stable ZAP Docker image
      REPORTS_DIR: ${{ github.workspace }}/reports

      # Quality gate thresholds: max allowed Medium/High alerts
      MAX_MEDIUM: "0"
      MAX_HIGH: "0"
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore and build solution
        run: |
          dotnet build

      #- name: Run unit tests
      #  run: |
      #    dotnet test --no-build

      - name: Ensure reports directory
        run: |
          mkdir -p "${REPORTS_DIR}"
          chmod 777 "${REPORTS_DIR}"

      - name: Start stack with Docker Compose
        run: |
          set -euo pipefail

          cat > .env << 'EOF'
          APP_URL=http://host.docker.internal:5200
          JWT_SECRET=test-secret-key-for-ci-only-change-before-prod-0001
          SMTP_PASSWORD=dummy-password
          EOF

          docker compose version
          docker compose up -d --build --quiet-pull
          docker compose ps

          for i in {1..180}; do
            if curl -fsS "${API_BASE_URL%/}/health" >/dev/null 2>&1; then
              echo "API is healthy"; break
            fi
            sleep 2
            if [ "$i" -eq 180 ]; then
              echo "Timeout waiting for API";
              docker compose logs --no-color --timestamps --tail=200 api || true
              exit 1
            fi
          done

          for i in {1..180}; do
            APP_CODE=$(curl -sS -o /dev/null -w "%{http_code}" "${APP_BASE_URL%/}/" 2>/dev/null || true)
            if [[ "$APP_CODE" =~ ^[0-9]{3}$ ]]; then
              echo "WebApp is reachable"; break
            fi
            sleep 2
            if [ "$i" -eq 180 ]; then
              echo "Timeout waiting for WebApp";
              docker compose logs --no-color --timestamps --tail=200 webapp || true
              exit 1
            fi
          done

      # Esegue la baseline scan (APP):
      # - Monta reports/ in /zap/wrk
      # - host.docker.internal per raggiungere le porte pubblicate da Docker Compose
      # - -I per ignorare gli INFO
      # - -t TARGET_APP e -r output HTML
      # - Non fallire immediatamente (|| true), il fallimento viene gestito dalla quality gate
      - name: Run ZAP Baseline scan (APP)
        run: |
          docker run --rm \
            --add-host host.docker.internal:host-gateway \
            -v "${REPORTS_DIR}:/zap/wrk" \
            "${ZAP_IMAGE}" \
            zap-baseline.py \
              -I \
              -m 0 \
              -t "${TARGET_APP}" \
              -r "zap-baseline-report-app.html" \
              -J "zap-baseline-report-app.json" || true

      # Esegue la baseline scan (API)
      - name: Run ZAP Baseline scan (API)
        run: |
          docker run --rm \
            --add-host host.docker.internal:host-gateway \
            -v "${REPORTS_DIR}:/zap/wrk" \
            "${ZAP_IMAGE}" \
            zap-baseline.py \
              -I \
              -m 0 \
              -t "${TARGET_API}" \
              -r "zap-baseline-report-api.html" \
              -J "zap-baseline-report-api.json" || true

      # Quality Gate: fallisce se il report contiene Medium/High > delle soglie
      - name: Quality gate (Medium/High)
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          reports = [
              ("APP", "zap-baseline-report-app.json"),
              ("API", "zap-baseline-report-api.json"),
          ]
          accepted_alerts = {
              # The current WebApp still has legacy Razor/template inline scripts
              # and styles. Keep the gate strict for every other Medium/High alert
              # while the frontend is moved to nonce/hash-based assets.
              "APP": {
                  "CSP: Wildcard Directive",
                  "CSP: script-src unsafe-eval",
                  "CSP: script-src unsafe-inline",
                  "CSP: style-src unsafe-inline",
              },
              "API": set(),
          }
          thresholds = {
              "medium": int(os.environ["MAX_MEDIUM"]),
              "high": int(os.environ["MAX_HIGH"]),
          }
          failed = False

          for label, report in reports:
              path = os.path.join(os.environ["REPORTS_DIR"], report)
              if not os.path.exists(path) or os.path.getsize(path) == 0:
                  print(f"Report non trovato o vuoto: {path}", file=sys.stderr)
                  failed = True
                  continue

              with open(path, encoding="utf-8") as handle:
                  data = json.load(handle)

              counts = {"medium": 0, "high": 0}
              accepted_counts = {"medium": 0, "high": 0}
              findings = []
              accepted_findings = []
              for site in data.get("site", []):
                  for alert in site.get("alerts", []):
                      alert_name = alert.get("alert", "Unknown alert")
                      risk = str(alert.get("riskdesc") or alert.get("risk") or "").lower()
                      if alert_name in accepted_alerts[label]:
                          if risk.startswith("medium"):
                              accepted_counts["medium"] += 1
                              accepted_findings.append(("Medium", alert_name))
                          elif risk.startswith("high"):
                              accepted_counts["high"] += 1
                              accepted_findings.append(("High", alert_name))
                          continue

                      if risk.startswith("medium"):
                          counts["medium"] += 1
                          findings.append(("Medium", alert_name))
                      elif risk.startswith("high"):
                          counts["high"] += 1
                          findings.append(("High", alert_name))

              print(
                  f"{label} -> Medium={counts['medium']}, High={counts['high']} "
                  f"(Soglie: Medium<={thresholds['medium']}, High<={thresholds['high']})"
              )
              if accepted_findings:
                  print(
                      f"{label} accepted technical debt -> "
                      f"Medium={accepted_counts['medium']}, High={accepted_counts['high']}"
                  )
                  for risk, alert_name in accepted_findings:
                      print(f"  accepted {risk}: {alert_name}")

              for risk, alert_name in findings:
                  print(f"  {risk}: {alert_name}")

              if counts["medium"] > thresholds["medium"] or counts["high"] > thresholds["high"]:
                  failed = True

          if failed:
              sys.exit(1)
          PY

      - name: Upload ZAP Baseline HTML report (APP)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-baseline-report-app
          path: reports/zap-baseline-report-app.*
          if-no-files-found: error

      - name: Upload ZAP Baseline HTML report (API)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-baseline-report-api
          path: reports/zap-baseline-report-api.*
          if-no-files-found: error


      - name: Send reports to Slack
        if: always() && env.SLACK_BOT_TOKEN != '' && env.SLACK_CHANNEL_ID != ''
        run: |
          for REPORT in zap-baseline-report-app.html zap-baseline-report-api.html; do
            curl -F "file=@${REPORTS_DIR}/$REPORT" \
                 -F "initial_comment=ZAP Baseline scan completed: $REPORT" \
                 -F "channels=$SLACK_CHANNEL_ID" \
                 -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
                 https://slack.com/api/files.uploadV2
          done

      - name: Show docker logs (on failure)
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --timestamps --tail=300 || true

      - name: Tear down
        if: always()
        run: docker compose down -v
