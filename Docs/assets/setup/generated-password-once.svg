<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Generated password shown once</title>
  <desc id="desc">The generated administrator password is displayed once and must be stored immediately.</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.card{fill:#fff;stroke:#cbd5e1;stroke-width:2}.secret{fill:#fef3c7;stroke:#f59e0b;stroke-width:2}.title{font:700 22px Arial,sans-serif;fill:#0f172a}.text{font:15px Arial,sans-serif;fill:#475569}.label{font:700 16px Arial,sans-serif;fill:#111827}.mono{font:16px Menlo,Consolas,monospace;fill:#92400e}.shield{fill:#0f766e}
    </style>
  </defs>
  <rect class="bg" width="960" height="360" rx="24"/>
  <text class="title" x="42" y="54">Temporary admin password is shown exactly once</text>
  <text class="text" x="42" y="82">OpenCashFlow stores only the hash. The plaintext value is not replayed after setup.</text>

  <rect class="card" x="190" y="122" width="580" height="170" rx="18"/>
  <circle class="shield" cx="250" cy="178" r="28"/>
  <text class="label" x="300" y="166">Setup complete</text>
  <text class="text" x="300" y="192">Store this generated password now.</text>
  <rect class="secret" x="300" y="216" width="330" height="42" rx="10"/>
  <text class="mono" x="324" y="243">••••-generated-once-••••</text>
  <text class="text" x="650" y="243">Shown once</text>
</svg>
