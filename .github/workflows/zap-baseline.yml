# OWASP ZAP Baseline Scan workflow
# - Runs a passive (baseline) scan against the locally started app
# - Generates HTML reports under reports/
# - Simple quality gate: fails if Medium/High alerts are found (> 0)

name: ZAP Baseline check

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
    tags:
      # Global RC tags
      - 'v*.*.*-RC'
      - 'v*.*.*.*-RC'

jobs:
  zap-baseline:
    name: zap-baseline
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gi
          POSTGRES_PASSWORD: gi
          POSTGRES_DB: gi_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gi -d gi_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Targets (App + API)
      TARGET_APP: http://127.0.0.1:7000
      TARGET_API: http://127.0.0.1:9000
      ZAP_IMAGE: zaproxy/zap-stable   # Stable ZAP Docker image
      REPORTS_DIR: ${{ github.workspace }}/reports

      # Quality gate thresholds: max allowed Medium/High alerts
      MAX_MEDIUM: "0"
      MAX_HIGH: "0"
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore and build solution
        run: |
          dotnet build

      #- name: Run unit tests
      #  run: |
      #    dotnet test --no-build

      - name: Ensure reports directory
        run: |
          mkdir -p "${REPORTS_DIR}"

      # Avvia APP e API via dotnet run su porte note da launchSettings
      - name: Start APP and API locally
        run: |
          set -euo pipefail

          # Wait for Postgres (GitHub Actions service) to be ready
          for i in {1..60}; do
            if docker run --rm --network host postgres:16 pg_isready -h 127.0.0.1 -p 5432 -U gi -d gi_ci >/dev/null 2>&1; then
              echo "Postgres is ready"; break; fi
            sleep 1
            if [ "$i" -eq 60 ]; then echo "Timeout waiting for Postgres"; exit 1; fi
          done

          # Provision fallback DB/user that the API might expect by default
          docker run --rm --network host -e PGPASSWORD=gi postgres:16 \
            psql -h 127.0.0.1 -U gi -d postgres -v ON_ERROR_STOP=1 -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='opencashflow') THEN CREATE ROLE opencashflow WITH LOGIN PASSWORD 'opencashflow'; END IF; END \$\$;"

          docker run --rm --network host -e PGPASSWORD=gi postgres:16 \
            psql -h 127.0.0.1 -U gi -d postgres -v ON_ERROR_STOP=1 <<'SQL'
            SELECT 'CREATE DATABASE opencashflow OWNER opencashflow'
            WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname='opencashflow')\gexec
            SQL

          # Common env
          export DOTNET_ENVIRONMENT=CI
          export ASPNETCORE_ENVIRONMENT=CI
          export DOTNET_LAUNCH_PROFILE=""

          # Bind URLs
          export ASPNETCORE_URLS_APP="${TARGET_APP}"
          export ASPNETCORE_URLS_API="${TARGET_API}"

          # Connection string for API (provide both common keys)
          export DB_CS="Host=127.0.0.1;Port=5432;Database=opencashflow;Username=opencashflow;Password=opencashflow"

          # Start WebApp and API with logs
          nohup bash -lc 'ASPNETCORE_URLS=${ASPNETCORE_URLS_APP} dotnet run --project src/OpenCashFlow.WebApp/OpenCashFlow.WebApp.csproj --no-build > app.log 2>&1' &
          nohup bash -lc 'ASPNETCORE_URLS=${ASPNETCORE_URLS_API} DEFAULT_CONN_STRING=${DB_CS} ConnectionStrings__DefaultConnectionString=${DB_CS} dotnet run --project src/OpenCashFlow.API/OpenCashFlow.API.csproj --no-build > api.log 2>&1' &

          APP_URL="${TARGET_APP%/}/"
          API_HEALTH="${TARGET_API%/}/health"

          # Wait up to 120s for readiness. API has /health; WebApp is ready if root responds.
          for i in {1..120}; do
            OK=0
            APP_CODE=$(curl -ksS -o /dev/null -w "%{http_code}" "$APP_URL" 2>/dev/null || true)
            [[ "$APP_CODE" =~ ^[0-9]{3}$ ]] && OK=$((OK+1)) || true
            curl -ksSf "$API_HEALTH" >/dev/null 2>&1 && OK=$((OK+1)) || true
            if [ "$OK" -eq 2 ]; then echo "App and API are up"; break; fi
            sleep 1
            if [ "$i" -eq 120 ]; then
              echo 'Service startup timeout';
              echo '--- APP LOG ---'; tail -n 200 app.log || true; echo '--------------';
              echo '--- API LOG ---'; tail -n 200 api.log || true; echo '--------------';
              exit 1;
            fi
          done

      # Esegue la baseline scan (APP):
      # - Monta reports/ in /zap/wrk
      # - --network=host per raggiungere i target localhost
      # - -I per ignorare gli INFO
      # - -t TARGET_APP e -r output HTML
      # - Non fallire immediatamente (|| true), il fallimento viene gestito dalla quality gate
      - name: Run ZAP Baseline scan (APP)
        run: |
          docker run --rm \
            --add-host host.docker.internal:host-gateway \
            -v "${REPORTS_DIR}:/zap/wrk" \
            "${ZAP_IMAGE}" \
            zap-baseline.py \
              -I \
              -m 0 \
              -t "http://host.docker.internal:7000" \
              -r "zap-baseline-report-app.html" || true

      # Esegue la baseline scan (API)
      - name: Run ZAP Baseline scan (API)
        run: |
          docker run --rm \
            --add-host host.docker.internal:host-gateway \
            -v "${REPORTS_DIR}:/zap/wrk" \
            "${ZAP_IMAGE}" \
            zap-baseline.py \
              -I \
              -m 0 \
              -t "http://host.docker.internal:9000" \
              -r "zap-baseline-report-api.html" || true

      # Quality Gate: fallisce se il report contiene Medium/High > delle soglie
      - name: Quality gate (Medium/High)
        run: |
          for REPORT in zap-baseline-report-app.html zap-baseline-report-api.html; do
            FILE="${REPORTS_DIR}/$REPORT"
            if [ ! -s "$FILE" ]; then echo "Report non trovato o vuoto: $FILE" >&2; exit 2; fi
            MEDIUM=$(grep -o "Medium" "$FILE" | wc -l | xargs)
            HIGH=$(grep -o "High" "$FILE" | wc -l | xargs)
            echo "$REPORT -> Medium=$MEDIUM, High=$HIGH (Soglie: Medium<=${MAX_MEDIUM}, High<=${MAX_HIGH})"
            if [ "$MEDIUM" -gt "$MAX_MEDIUM" ] || [ "$HIGH" -gt "$MAX_HIGH" ]; then
              echo "Quality gate fallita per $REPORT" >&2; exit 1
            fi
          done

      - name: Upload ZAP Baseline HTML report (APP)
        uses: actions/upload-artifact@v4
        with:
          name: zap-baseline-report-app
          path: reports/zap-baseline-report-app.html
          if-no-files-found: error

      - name: Upload ZAP Baseline HTML report (API)
        uses: actions/upload-artifact@v4
        with:
          name: zap-baseline-report-api
          path: reports/zap-baseline-report-api.html
          if-no-files-found: error


      - name: Send reports to Slack
        if: always() && env.SLACK_BOT_TOKEN != '' && env.SLACK_CHANNEL_ID != ''
        run: |
          for REPORT in zap-baseline-report-app.html zap-baseline-report-api.html; do
            curl -F "file=@${REPORTS_DIR}/$REPORT" \
                 -F "initial_comment=ZAP Baseline scan completed: $REPORT" \
                 -F "channels=$SLACK_CHANNEL_ID" \
                 -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
                 https://slack.com/api/files.uploadV2
          done
