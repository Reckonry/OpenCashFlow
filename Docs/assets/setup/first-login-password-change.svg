<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">First login requires password change</title>
  <desc id="desc">After login with the temporary password, the administrator must change it before normal use.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#1f2937"/>
    </marker>
    <style>
      .bg{fill:#f8fafc}.step{fill:#fff;stroke:#cbd5e1;stroke-width:2}.title{font:700 22px Arial,sans-serif;fill:#0f172a}.text{font:15px Arial,sans-serif;fill:#475569}.label{font:700 17px Arial,sans-serif;fill:#111827}.small{font:13px Arial,sans-serif;fill:#64748b}.line{stroke:#1f2937;stroke-width:3;fill:none;marker-end:url(#arrow)}.blue{fill:#2563eb}.green{fill:#059669}
    </style>
  </defs>
  <rect class="bg" width="960" height="360" rx="24"/>
  <text class="title" x="42" y="54">First login forces a password change</text>
  <text class="text" x="42" y="82">The temporary password is only a bootstrap credential.</text>

  <rect class="step" x="90" y="136" width="210" height="110" rx="16"/>
  <circle class="blue" cx="126" cy="174" r="18"/>
  <text class="label" x="160" y="170">Login</text>
  <text class="small" x="160" y="194">Use temporary password</text>

  <path class="line" d="M310 190 H390"/>

  <rect class="step" x="400" y="136" width="210" height="110" rx="16"/>
  <circle class="blue" cx="436" cy="174" r="18"/>
  <text class="label" x="470" y="170">Change password</text>
  <text class="small" x="470" y="194">Required before normal use</text>

  <path class="line" d="M620 190 H700"/>

  <rect class="step" x="710" y="136" width="170" height="110" rx="16"/>
  <circle class="green" cx="746" cy="174" r="18"/>
  <text class="label" x="780" y="170">Ready</text>
  <text class="small" x="780" y="194">Open dashboard</text>
</svg>
