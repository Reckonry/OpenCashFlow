name: CI - RC Prerelease Artifacts

on:
  push:
    tags:
      - "v*.*.*-RC"
      - "v*.*.*.*-RC"
      - "webapp-v*.*.*-RC"
      - "webapp-v*.*.*.*-RC"
      - "api-v*.*.*-RC"
      - "api-v*.*.*.*-RC"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to use for RC run (e.g. v1.2.3-RC, webapp-v1.2.3-RC)"
        required: true
        type: string
      create_release:
        description: "Create/Update GitHub Release for this RC tag"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: rc-${{ github.ref_name }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: "9.0.x"
  TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore OpenCashFlow.sln

      - name: Build
        run: dotnet build OpenCashFlow.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test OpenCashFlow.sln --configuration Release --no-build

  rc-release:
    name: RC Artifacts
    needs: build-and-test
    if: ${{ (startsWith(github.ref, 'refs/tags/') && endsWith(github.ref_name, '-RC')) || (github.event_name == 'workflow_dispatch' && endsWith(github.event.inputs.tag, '-RC')) }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare artifacts
        run: mkdir -p artifacts/docker

      - name: Determine scope
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          TAG="${TAG_NAME}"

          DEPLOY_WEBAPP=0
          DEPLOY_API=0

          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?-RC$ ]]; then
            DEPLOY_WEBAPP=1
            DEPLOY_API=1
          elif [[ "$TAG" =~ ^webapp-v.*-RC$ ]]; then
            DEPLOY_WEBAPP=1
          elif [[ "$TAG" =~ ^api-v.*-RC$ ]]; then
            DEPLOY_API=1
          else
            echo "Unrecognized RC tag format: $TAG"
            exit 1
          fi

          echo "DEPLOY_WEBAPP=$DEPLOY_WEBAPP" >> "$GITHUB_OUTPUT"
          echo "DEPLOY_API=$DEPLOY_API" >> "$GITHUB_OUTPUT"

      - name: Publish WebApp
        if: steps.scope.outputs.DEPLOY_WEBAPP == '1'
        run: dotnet publish src/OpenCashFlow.WebApp/OpenCashFlow.WebApp.csproj --configuration Release --output artifacts/webapp-publish

      - name: Upload WebApp publish artifact
        if: steps.scope.outputs.DEPLOY_WEBAPP == '1'
        uses: actions/upload-artifact@v4
        with:
          name: webapp-publish
          path: artifacts/webapp-publish/

      - name: Build WebApp Docker image
        if: steps.scope.outputs.DEPLOY_WEBAPP == '1'
        run: |
          TAG="${TAG_NAME}"
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${REPO}-webapp:${TAG}"
          docker build -t "$IMAGE" -f src/OpenCashFlow.WebApp/Dockerfile .
          docker save "$IMAGE" | gzip > "artifacts/docker/webapp-${TAG}.tar.gz"

      - name: Upload WebApp Docker artifact
        if: steps.scope.outputs.DEPLOY_WEBAPP == '1'
        uses: actions/upload-artifact@v4
        with:
          name: webapp-docker
          path: artifacts/docker/webapp-${{ env.TAG_NAME }}.tar.gz

      - name: Publish API
        if: steps.scope.outputs.DEPLOY_API == '1'
        run: dotnet publish src/OpenCashFlow.API/OpenCashFlow.API.csproj --configuration Release --output artifacts/api-publish

      - name: Upload API publish artifact
        if: steps.scope.outputs.DEPLOY_API == '1'
        uses: actions/upload-artifact@v4
        with:
          name: api-publish
          path: artifacts/api-publish/

      - name: Build API Docker image
        if: steps.scope.outputs.DEPLOY_API == '1'
        run: |
          TAG="${TAG_NAME}"
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${REPO}-api:${TAG}"
          docker build -t "$IMAGE" -f src/OpenCashFlow.API/Dockerfile .
          docker save "$IMAGE" | gzip > "artifacts/docker/api-${TAG}.tar.gz"

      - name: Upload API Docker artifact
        if: steps.scope.outputs.DEPLOY_API == '1'
        uses: actions/upload-artifact@v4
        with:
          name: api-docker
          path: artifacts/docker/api-${{ env.TAG_NAME }}.tar.gz

      - name: Create/Update GitHub Release
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.create_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.TAG_NAME }}
          prerelease: true
          generate_release_notes: true
          files: artifacts/docker/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
