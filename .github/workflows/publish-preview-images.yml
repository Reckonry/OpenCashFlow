name: Publish Preview Docker Images

on:
  push:
    tags:
      - "v*-preview.*"

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-preview-images-${{ github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/reckonry/opencashflow-api
  WEBAPP_IMAGE: ghcr.io/reckonry/opencashflow-webapp

jobs:
  publish:
    name: Build and publish preview images
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/OpenCashFlow.API/Dockerfile
          push: true
          tags: ${{ env.API_IMAGE }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.title=OpenCashFlow API

      - name: Build and push WebApp image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/OpenCashFlow.WebApp/Dockerfile
          push: true
          tags: ${{ env.WEBAPP_IMAGE }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.title=OpenCashFlow WebApp
