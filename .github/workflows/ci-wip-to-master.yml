# -----------------------------------------------------------------------------------
# CI WORKFLOW: BRANCH PROMOTION + BUILD/TEST
# Purpose: build and test on push/PR to 'master' and, when requested,
#          perform an automated merge from a source branch to a target branch.
#          Works for Pull Requests (uses PR head/base) and manual runs
#          (uses UI inputs with defaults test -> master).
# -----------------------------------------------------------------------------------
name: CI/CD - Merging or pulling branches into 'master'

on:
  # Trigger on direct pushes to master (build/test only; merge job is disabled on pushes)
  push:
    branches:
      - master
  # Trigger on PRs to master: merge job automatically uses PR head_ref (source) and base_ref (target)
  pull_request:
    branches:
      - master
  # Manual run: lets you choose source/target branches from the UI
  # If left empty, defaults are applied: source=test, target=master
  workflow_dispatch:
    inputs:
      source_branch:
        description: "Branch to merge FROM"
        required: false
        default: "test"
      target_branch:
        description: "Branch to merge INTO"
        required: false
        default: "master"

# Required permission to push merge commits using GITHUB_TOKEN
permissions:
  contents: write  # Required to push to master using GITHUB_TOKEN

jobs:
  # JOB 1: Build & Test
  # - Restores/builds/tests the solution.
  # - The 'if' condition allows skipping tests when marked with [DNT]
  #   or when the branch name contains specific patterns.
  build-and-test:
    name: 🔧 Build & Test (push/PR on 'master')
    runs-on: ubuntu-latest
    # Skips build/test when:
    # - push with commit message containing [DNT]
    # - branch name contains 'no-tests' or 'wip/'
    # - PR title or body contains [DNT]
    if: >
      ${{ !(
        (github.event_name == 'push' &&
          (contains(github.event.head_commit.message, '[DNT]') ||
           contains(github.ref_name, 'no-tests') ||
           contains(github.ref_name, 'wip/')))
        ||
        (github.event_name == 'pull_request' &&
          (
            (github.event.pull_request.title != '' && contains(github.event.pull_request.title, '[DNT]')) ||
            (github.event.pull_request.body  != '' && contains(github.event.pull_request.body,  '[DNT]'))
          ))
        ||
        (github.event_name == 'workflow_dispatch' &&
          (contains(github.ref_name, 'no-tests') ||
           contains(github.ref_name, 'wip/')))
      ) }}

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🧰 Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: 📦 Restore solution
        run: dotnet restore OpenCashFlow.sln

      - name: 🛠️ Build solution
        run: dotnet build OpenCashFlow.sln --configuration Release --no-restore

      - name: 🧪 Run tests (all projects in the solution)
        run: dotnet test OpenCashFlow.sln --configuration Release --no-build

  # JOB 2: Promote (automated merge)
  # - For pull_request it uses:
  #     SOURCE_BRANCH = github.head_ref (PR branch)
  #     TARGET_BRANCH = github.base_ref (PR base branch)
  # - For workflow_dispatch it uses UI inputs (default: test -> master)
  # - Does not run on push (to avoid loops) and only runs if build-and-test succeeded
  promote-and-deploy:
    # Branch resolution based on event:
    # - pull_request: head_ref/base_ref of the PR
    # - manual: user inputs
    # - fallback: test/master
    name: 🚀 Merge (auto promote)
    needs: build-and-test
    runs-on: ubuntu-latest
    env:
      SOURCE_BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || (github.event.inputs.source_branch != '' && github.event.inputs.source_branch || 'test') }}
      TARGET_BRANCH: ${{ github.event_name == 'pull_request' && github.base_ref || (github.event.inputs.target_branch != '' && github.event.inputs.target_branch || 'master') }}
    # Always evaluates, but proceeds only if build-and-test succeeded and event is NOT a push
    if: ${{ always() && needs.build-and-test.result == 'success' && github.event_name != 'push' }}

    steps:
      # Full checkout (fetch-depth: 0) to allow correct merges with full history
      - name: ⬇️ Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Configure git identity for workflow-generated commits
      - name: 🧰 Configure git
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

      - name: 🧾 Show resolved branches
        run: |
          echo "SOURCE_BRANCH=${SOURCE_BRANCH}"
          echo "TARGET_BRANCH=${TARGET_BRANCH}"
      - name: 🔀 Merge ${{ env.SOURCE_BRANCH }} into ${{ env.TARGET_BRANCH }} & push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Branch resolution:
          # - PR: SOURCE_BRANCH=github.head_ref, TARGET_BRANCH=github.base_ref
          # - Manual: read from UI inputs
          # - Fallback: SOURCE_BRANCH=test, TARGET_BRANCH=master
          SOURCE_BRANCH="${SOURCE_BRANCH:-test}"
          TARGET_BRANCH="${TARGET_BRANCH:-master}"
          echo "Preparing to merge origin/${SOURCE_BRANCH} -> ${TARGET_BRANCH}"
          
          # Update remote references and prune obsolete ones
          git fetch origin --prune
          
          # If the source branch does not exist on remote, exit cleanly (no pipeline failure)
          if ! git ls-remote --heads origin "${SOURCE_BRANCH}" | grep -q .; then
            echo "Source branch 'origin/${SOURCE_BRANCH}' not found. Skipping promote."
            exit 0
          fi
          
          # Checkout target branch and sync with remote
          git checkout "${TARGET_BRANCH}"
          git pull origin "${TARGET_BRANCH}"
          
          # Perform the merge with an explicit commit (--no-ff) and standardized message
          git merge --no-ff --no-edit "origin/${SOURCE_BRANCH}" -m "🔁 Automated merge from ${SOURCE_BRANCH} into ${TARGET_BRANCH}"
          
          # Push to target branch using workflow's GITHUB_TOKEN
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" "HEAD:${TARGET_BRANCH}"
