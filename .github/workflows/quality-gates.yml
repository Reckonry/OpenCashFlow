name: Quality Gates

on:
  pull_request:
    branches: [ main, development ]
    types: [ opened, synchronize, reopened, ready_for_review ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-test-audit:
    name: Build, test, compose, audit
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore OpenCashFlow.sln

      - name: Dependency vulnerability audit
        run: dotnet list OpenCashFlow.sln package --vulnerable --include-transitive

      - name: Build Release
        run: dotnet build OpenCashFlow.sln --configuration Release --no-restore

      - name: Test Release
        run: dotnet test OpenCashFlow.sln --configuration Release --no-build --logger "console;verbosity=normal"

      - name: Docker Compose config
        run: docker compose config

